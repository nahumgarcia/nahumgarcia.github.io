---
layout: default
---

<section class="site-header">
  <h1 class="smallcap">
    <a class="site-title" href="{{ '/' | prepend: site.baseurl | prepend: site.url }}">
      {{ site.title }}
    </a>
  </h1>
</section>

<header class="post-header">
  <h1 class="post-title">{{ page.title }}</h1>
</header>

<!-- Galería de Fotos -->
<ul class="photo-gallery photo-gallery--single">
  {% for photo in page.photos.items %}
    <li class="photo-gallery_item">
      <div class="photo-container">
        <img 
          src="{{ site.baseurl }}/assets/photos/{{ page.photos.set }}/{{ photo.file }}" 
          alt="{{ photo.description }}"
          class="gallery-image"
          data-description="{{ photo.description }}"
        >
      </div>
    </li>
  {% endfor %}
</ul>

<div>
  <a href="{{ site.baseurl }}/photos/">Ver todas las galerías</a>
</div>

<!-- Lightbox -->
<div id="lightbox" class="lightbox">
  <span class="lightbox-close">&times;</span>
  <img id="lightbox-img" src="" alt="">
  <p class="description" id="lightbox-desc"></p>
</div>

<script>
// Lightbox
document.querySelectorAll('.photo-container img').forEach(img => {
  img.addEventListener('click', () => {
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const caption = document.getElementById('lightbox-caption');
    
    lightboxImg.src = img.src;
    caption.textContent = img.closest('.photo-gallery_item').dataset.caption; // Usamos dataset
    lightbox.style.display = 'block';
  });
});

// Cerrar lightbox
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target === lightbox || e.target === lightboxImg) {
    lightbox.style.display = 'none';
  }
});

// Detección automática de orientación (script previo)
document.addEventListener('DOMContentLoaded', function() {
  const detectOrientation = () => {
    document.querySelectorAll('.photo-gallery_item').forEach(item => {
      const img = item.querySelector('img');
      if (img && img.complete) {
        item.dataset.caption = img.alt; // Guardamos la descripción en dataset
        if (img.naturalWidth > img.naturalHeight) {
          item.classList.add('horizontal');
        } else {
          item.classList.add('vertical');
        }
      }
    });
  };
  window.addEventListener('load', detectOrientation);
});
</script>

<div class="lightbox" id="lightbox">
  <div class="lightbox-content">
    <img class="lightbox-img" id="lightbox-img">
    <div class="lightbox-caption" id="lightbox-caption"></div>
  </div>
</div>
