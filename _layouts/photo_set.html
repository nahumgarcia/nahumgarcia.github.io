---
layout: default
---

<section class="site-header">
  <h1 class="smallcap">
    <a class="site-title" href="{{ '/' | prepend: site.baseurl | prepend: site.url }}">
      {{ site.title }}
    </a>
  </h1>
</section>

<header class="post-header">
  <h1 class="post-title">{{ page.title }}</h1>
</header>

<!-- Galería de Fotos -->
<ul class="photo-gallery photo-gallery--single">
  {% for photo in page.photos.items %}
    <li class="photo-gallery_item">
      <div class="photo-container">
        <img 
          src="{{ site.baseurl }}/assets/photos/{{ page.photos.set }}/{{ photo.file }}" 
          alt="{{ photo.description }}"
          class="gallery-image"
          data-description="{{ photo.description }}"
        >
      </div>
    </li>
  {% endfor %}
</ul>

<div>
  <a href="{{ site.baseurl }}/photos/">Ver todas las galerías</a>
</div>

<!-- Lightbox -->
<div id="lightbox" class="lightbox">
  <span class="lightbox-close">&times;</span>
  <img id="lightbox-img" src="" alt="">
  <p class="description" id="lightbox-desc"></p>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const images = document.querySelectorAll(".photo-gallery_item img");
  const lightbox = document.createElement("div");
  lightbox.classList.add("lightbox");
  lightbox.innerHTML = `
    <span class="lightbox-close">&times;</span>
    <img class="lightbox-img">
    <p class="description"></p>
    <span class="lightbox-arrow left">&#10094;</span>
    <span class="lightbox-arrow right">&#10095;</span>
  `;
  document.body.appendChild(lightbox);

  const lightboxImg = lightbox.querySelector(".lightbox-img");
  const lightboxDesc = lightbox.querySelector(".description");
  const closeBtn = lightbox.querySelector(".lightbox-close");
  const leftArrow = lightbox.querySelector(".lightbox-arrow.left");
  const rightArrow = lightbox.querySelector(".lightbox-arrow.right");

  let currentIndex = 0;

  function showLightbox(index) {
    if (index < 0) index = images.length - 1;
    if (index >= images.length) index = 0;

    currentIndex = index;
    const img = images[index];
    lightboxImg.src = img.src;
    lightboxDesc.textContent = img.alt || "";
    lightbox.style.display = "flex";
  }

  images.forEach((img, index) => {
    img.addEventListener("click", () => showLightbox(index));
  });

  closeBtn.addEventListener("click", () => {
    lightbox.style.display = "none";
  });

  leftArrow.addEventListener("click", () => showLightbox(currentIndex - 1));
  rightArrow.addEventListener("click", () => showLightbox(currentIndex + 1));

  document.addEventListener("keydown", (e) => {
    if (lightbox.style.display === "flex") {
      if (e.key === "ArrowLeft") showLightbox(currentIndex - 1);
      if (e.key === "ArrowRight") showLightbox(currentIndex + 1);
      if (e.key === "Escape") lightbox.style.display = "none";
    }
  });
});
</script>
