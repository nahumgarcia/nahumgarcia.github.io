---
layout: default
---
<section class="site-header">
  <h1 class="smallcap">
    <a class="site-title" href="{{ '/' | prepend: site.baseurl | prepend: site.url }}">{{ site.title }}</a>
  </h1>
</section>

<header class="post-header">
  <h1 class="post-title">{{ page.title }}</h1>
  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%b %d, %Y" }}</time>
  </p>
</header>

<!-- Solo una galería -->
<div class="gallery-container">
  <ul class="photo-gallery">
    {% for photo in page.photos.items %}
    <li class="photo-gallery_item">
      <div class="photo-container">
        <img
          src="{{ site.baseurl }}/assets/photos/{{ page.photos.set }}/{{ photo.file }}"
          alt="{{ photo.description }}"
          class="gallery-image"
          data-description="{{ photo.description }}"
          onload="this.naturalWidth > this.naturalHeight ? this.parentElement.parentElement.classList.add('horizontal') : this.parentElement.parentElement.classList.add('vertical')"
        >
        <!-- Icono de comentario -->
        {% if photo.description %}
          <div class="photo-info-icon" title="Esta foto tiene descripción">
            <svg viewBox="0 0 24 24" width="24" height="24">
              <path fill="currentColor" d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
            </svg>
          </div>
        {% endif %}
      </div>
    </li>
    {% endfor %}
  </ul>
</div>


<h2 class="post-title">
  <a href="{{ site.baseurl }}/photos/" title="Volver a la página de galerías" style="text-decoration: none;">←</a>
</h2>


<script>
document.addEventListener("DOMContentLoaded", function() {
    const images = document.querySelectorAll(".photo-gallery_item img");
    const lightbox = document.createElement("div");
    lightbox.classList.add("lightbox");
    
    // Mejora el HTML del lightbox con clases más específicas
    lightbox.innerHTML = `
        <span class="lightbox-close">&times;</span>
        <span class="lightbox-arrow left">&lsaquo;</span>
        <img class="lightbox-img" src="" alt="">
        <p class="lightbox-description"></p>
        <span class="lightbox-arrow right">&rsaquo;</span>
    `;
    
    document.body.appendChild(lightbox);
    
    const lightboxImg = lightbox.querySelector(".lightbox-img");
    const lightboxDesc = lightbox.querySelector(".lightbox-description");
    const closeBtn = lightbox.querySelector(".lightbox-close");
    const leftArrow = lightbox.querySelector(".lightbox-arrow.left");
    const rightArrow = lightbox.querySelector(".lightbox-arrow.right");
    let currentIndex = 0;
    
    function showLightbox(index) {
        if (index < 0) index = images.length - 1;
        if (index >= images.length) index = 0;
        
        currentIndex = index;
        const img = images[index];
        
        // Añade una transición suave
        lightboxImg.style.opacity = '0';
        setTimeout(() => {
            lightboxImg.src = img.src;
            lightboxDesc.textContent = img.dataset.description || img.alt;
            lightboxImg.style.opacity = '1';
        }, 200);
        
        lightbox.style.display = "flex";
    }
    
    // Eventos para cada imagen
    images.forEach((img, index) => {
        img.addEventListener("click", () => showLightbox(index));
    });
    
    // Cierra el lightbox
    closeBtn.addEventListener("click", () => {
        lightbox.style.display = "none";
    });
    
    // Navegación
    leftArrow.addEventListener("click", (e) => {
        e.stopPropagation();
        showLightbox(currentIndex - 1);
    });
    
    rightArrow.addEventListener("click", (e) => {
        e.stopPropagation();
        showLightbox(currentIndex + 1);
    });
    
    // Eventos de teclado
    document.addEventListener("keydown", (e) => {
        if (lightbox.style.display === "flex") {
            if (e.key === "ArrowLeft") showLightbox(currentIndex - 1);
            if (e.key === "ArrowRight") showLightbox(currentIndex + 1);
            if (e.key === "Escape") lightbox.style.display = "none";
        }
    });
    
    // Cierra el lightbox al hacer clic fuera de la imagen
    lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) {
            lightbox.style.display = "none";
        }
    });
});
</script>
