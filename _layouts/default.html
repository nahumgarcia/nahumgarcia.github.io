<!DOCTYPE html>
<html>
  {% include head.html %}

  <body>
    <div class="site-header-outer">
      <header class="site-header">
        <h1 class="smallcap"><a class="site-title" href="{{ '/' | prepend: site.baseurl | prepend: site.url }}">
          <span class="logo-wrapper">
            <img src="{{ '/assets/images/logo-bn.svg' | prepend: site.baseurl }}" alt="{{ site.title }}" class="site-logo site-logo-bn">
            <img src="{{ '/assets/images/logo-color.svg' | prepend: site.baseurl }}" alt="" class="site-logo site-logo-color">
          </span>
        </a></h1>
        <div class="site-nav-row">
          <div class="site-nav-col">
            {% include nav.html %}
            {% if page.url contains '/fotos' %}
            {% include photo_subnav.html %}
            {% endif %}
          </div>
          <button class="theme-toggle" id="theme-toggle" aria-label="Tema: automático">
            <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
        </div>
      </header>
    </div>
    <div class="site-outer">
      <div class="page-content">
        {{ content }}
      </div>
      {% include footer.html %}
    </div>
  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var current = document.documentElement.getAttribute('data-theme');
        var currentEffective = current || (systemPrefersDark ? 'dark' : 'light');
        var next = currentEffective === 'dark' ? 'light' : 'dark';
        var nextMatchesSystem = (next === 'dark') === systemPrefersDark;
        if (nextMatchesSystem) {
          document.documentElement.removeAttribute('data-theme');
          localStorage.removeItem('theme');
          btn.setAttribute('aria-label', 'Tema: automático');
        } else {
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
          btn.setAttribute('aria-label', next === 'dark' ? 'Tema: oscuro' : 'Tema: claro');
        }
      });
    })();
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var tooltip = document.createElement('div');
      tooltip.className = 'footnote-tooltip';
      document.body.appendChild(tooltip);
      var activeLink = null;

      document.querySelectorAll('a.footnote').forEach(function (link) {
        link.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();

          if (activeLink === this && tooltip.style.display === 'block') {
            tooltip.style.display = 'none';
            activeLink = null;
            return;
          }

          var id = this.getAttribute('href').slice(1);
          var fnEl = document.getElementById(id);
          if (!fnEl) return;

          var clone = fnEl.cloneNode(true);
          clone.querySelectorAll('.reversefootnote').forEach(function (a) { a.remove(); });
          tooltip.innerHTML = clone.innerHTML;
          tooltip.style.display = 'block';
          tooltip.classList.remove('below');

          var linkRect = this.getBoundingClientRect();
          var scrollX = window.scrollX || window.pageXOffset;
          var scrollY = window.scrollY || window.pageYOffset;
          var ttW = tooltip.offsetWidth;
          var ttH = tooltip.offsetHeight;

          var left = linkRect.left + scrollX + linkRect.width / 2 - ttW / 2;
          var top  = linkRect.top  + scrollY - ttH - 12;

          if (left < scrollX + 10) left = scrollX + 10;
          if (left + ttW > scrollX + window.innerWidth - 10) left = scrollX + window.innerWidth - ttW - 10;

          if (top < scrollY + 10) {
            top = linkRect.bottom + scrollY + 12;
            tooltip.classList.add('below');
          }

          var tailLeft = Math.max(16, Math.min(
            linkRect.left + scrollX + linkRect.width / 2 - left,
            ttW - 16
          ));
          tooltip.style.setProperty('--tail-left', tailLeft + 'px');
          tooltip.style.left = left + 'px';
          tooltip.style.top  = top  + 'px';
          activeLink = this;
        });
      });

      document.addEventListener('click', function () {
        tooltip.style.display = 'none';
        activeLink = null;
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          tooltip.style.display = 'none';
          activeLink = null;
        }
      });
    });
  </script>
  </body>
</html>
