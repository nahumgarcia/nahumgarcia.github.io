<script>
document.addEventListener("DOMContentLoaded", function() {
    var lightbox = document.createElement("div");
    lightbox.classList.add("lightbox");
    lightbox.innerHTML = '<div class="lightbox-photo-area"><img class="lightbox-img" src="" alt=""></div>'
        + '<div class="lightbox-bottom">'
        + '<div class="lightbox-info">'
        + '<h3 class="lightbox-title"></h3>'
        + '<p class="lightbox-meta"></p>'
        + '<p class="lightbox-description"></p>'
        + '<a class="lightbox-permalink" href="#">Ver publicación &rarr;</a>'
        + '</div>'
        + '<div class="lightbox-controls">'
        + '<span class="lightbox-arrow left"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.5" fill="none"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></span>'
        + '<span class="lightbox-close"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.5" fill="none"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>'
        + '<span class="lightbox-arrow right"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="1.5" fill="none"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></span>'
        + '</div></div>';
    document.body.appendChild(lightbox);

    var lightboxImg = lightbox.querySelector(".lightbox-img");
    var lightboxTitle = lightbox.querySelector(".lightbox-title");
    var lightboxMeta = lightbox.querySelector(".lightbox-meta");
    var lightboxDesc = lightbox.querySelector(".lightbox-description");
    var lightboxPermalink = lightbox.querySelector(".lightbox-permalink");
    var closeBtn = lightbox.querySelector(".lightbox-close");
    var leftArrow = lightbox.querySelector(".lightbox-arrow.left");
    var rightArrow = lightbox.querySelector(".lightbox-arrow.right");
    var currentPhotos = [];
    var currentIndex = 0;

    function setField(el, value) {
        if (value) { el.textContent = value; el.style.display = ''; }
        else { el.textContent = ''; el.style.display = 'none'; }
    }

    function showLightbox(index, direction) {
        if (index < 0) index = currentPhotos.length - 1;
        if (index >= currentPhotos.length) index = 0;
        currentIndex = index;
        var photo = currentPhotos[index];
        var src = photo.dataset.full;

        // Slide animation
        if (direction && lightbox.style.display === "flex") {
            var offset = direction === 'left' ? '-100%' : '100%';
            lightboxImg.style.transition = 'none';
            lightboxImg.style.transform = 'translateX(' + offset + ')';
            lightboxImg.style.opacity = '0';
            // Force reflow
            lightboxImg.offsetWidth;
            lightboxImg.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
            lightboxImg.style.transform = 'translateX(0)';
            lightboxImg.style.opacity = '1';
        } else {
            lightboxImg.style.transition = 'none';
            lightboxImg.style.transform = 'translateX(0)';
            lightboxImg.style.opacity = '1';
        }

        lightboxImg.style.display = 'none';
        lightboxImg.src = '';
        setField(lightboxTitle, photo.dataset.title);
        setField(lightboxMeta, photo.dataset.meta);
        setField(lightboxDesc, photo.dataset.desc || photo.dataset.alt);
        if (photo.dataset.url) {
            lightboxPermalink.href = photo.dataset.url;
            lightboxPermalink.style.display = '';
        } else {
            lightboxPermalink.style.display = 'none';
        }
        var newImg = new Image();
        newImg.onload = function() { lightboxImg.src = newImg.src; lightboxImg.style.display = ''; };
        newImg.src = src;
        lightbox.style.display = "flex";
        document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
        lightbox.style.display = "none";
        document.body.style.overflow = "";
    }

    // Bind photo groups
    var containers = document.querySelectorAll("{{ include.selector }}");
    containers.forEach(function(container) {
        var photos = container.querySelectorAll("{{ include.photo_selector }}");
        photos.forEach(function(photo, idx) {
            photo.addEventListener("click", function(e) {
                e.preventDefault();
                currentPhotos = Array.from(photos);
                showLightbox(idx);
            });
        });
    });

    // Controls
    closeBtn.addEventListener("click", function() { closeBtn.blur(); closeLightbox(); });
    leftArrow.addEventListener("click", function(e) { e.stopPropagation(); leftArrow.blur(); showLightbox(currentIndex - 1, 'right'); });
    rightArrow.addEventListener("click", function(e) { e.stopPropagation(); rightArrow.blur(); showLightbox(currentIndex + 1, 'left'); });
    document.addEventListener("keydown", function(e) {
        if (lightbox.style.display === "flex") {
            if (e.key === "ArrowLeft") showLightbox(currentIndex - 1, 'right');
            if (e.key === "ArrowRight") showLightbox(currentIndex + 1, 'left');
            if (e.key === "Escape") closeLightbox();
        }
    });
    lightbox.addEventListener("click", function(e) {
        if (e.target === lightbox || e.target.classList.contains('lightbox-photo-area')) closeLightbox();
    });

    // Swipe support
    var touchStartX = 0;
    var touchStartY = 0;
    var swiping = false;

    lightbox.addEventListener("touchstart", function(e) {
        if (e.touches.length === 1) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            swiping = true;
        }
    }, { passive: true });

    lightbox.addEventListener("touchmove", function(e) {
        if (!swiping) return;
        var dx = e.touches[0].clientX - touchStartX;
        var dy = e.touches[0].clientY - touchStartY;
        // If horizontal swipe is dominant, prevent vertical scroll and show drag
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
            e.preventDefault();
            lightboxImg.style.transition = 'none';
            lightboxImg.style.transform = 'translateX(' + dx + 'px)';
            lightboxImg.style.opacity = Math.max(0.5, 1 - Math.abs(dx) / 500);
        }
    }, { passive: false });

    lightbox.addEventListener("touchend", function(e) {
        if (!swiping) return;
        swiping = false;
        var dx = e.changedTouches[0].clientX - touchStartX;
        var dy = e.changedTouches[0].clientY - touchStartY;
        // Minimum 50px horizontal swipe, more horizontal than vertical
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
            // Animate current image out before showing next
            lightboxImg.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
            lightboxImg.style.transform = 'translateX(' + (dx < 0 ? '-100%' : '100%') + ')';
            lightboxImg.style.opacity = '0';
            setTimeout(function() {
                if (dx < 0) showLightbox(currentIndex + 1, 'left');
                else showLightbox(currentIndex - 1, 'right');
            }, 200);
        } else {
            // Snap back
            lightboxImg.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
            lightboxImg.style.transform = 'translateX(0)';
            lightboxImg.style.opacity = '1';
        }
    }, { passive: true });
});
</script>
