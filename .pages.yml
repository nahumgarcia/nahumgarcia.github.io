media:
  - name: post-images
    label: "Imágenes de escritos"
    input: assets/images
    output: /assets/images
    categories: [image]
  - name: photo-assets
    label: "Fotos (assets/photos)"
    input: assets/photos
    output: /assets/photos
    categories: [image]

content:
  - name: posts
    label: Escritos
    type: collection
    path: content/_posts
    view:
      fields: [date, title, tags]
      primary: title
    fields:
      - { name: title, label: Título, type: string, required: true }
      - { name: subtitle, label: Subtítulo, type: string }
      - { name: image, label: "Imagen (og:image)", type: image, options: { media: post-images } }
      - { name: author, label: Autor, type: string, default: "Nahúm" }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: toc, label: "Tabla de contenidos", type: boolean }
      - { name: body, label: Contenido, type: text }

  - name: photos
    label: "Fotos (publicaciones)"
    type: collection
    path: content/_photos
    view:
      fields: [date, title]
      primary: title
    fields:
      - { name: date, label: Fecha, type: date, required: true }
      - { name: title, label: Título, type: string }
      - { name: albums, label: Álbumes, type: string, list: true }
      - { name: tags, label: Tags, type: string, list: true }
      - name: photos
        label: Fotos
        type: object
        list: true
        fields:
          - { name: file, label: "Archivo (en assets/photos/)", type: string, required: true }
          - { name: alt, label: "Texto alternativo", type: string }
      - { name: body, label: "Descripción / caption", type: text }

  - name: photoalbums
    label: Álbumes
    type: collection
    path: content/_photoalbums
    filename: "{fields.slug}.md"
    view:
      fields: [title, slug]
      primary: title
    fields:
      - { name: layout, type: string, hidden: true, default: album }
      - { name: title, label: Título, type: string, required: true }
      - { name: slug, label: Slug, type: string, required: true }
      - { name: date, label: Fecha, type: date }
      - { name: cover_photo, label: "Foto de portada (en assets/photos/)", type: string }

  - name: about
    label: "Sobre mí"
    type: file
    path: pages/about.md
    fields:
      - { name: layout, type: string, hidden: true, default: page }
      - { name: title, label: Título, type: string, required: true }
      - { name: permalink, type: string, hidden: true, default: "/sobremi/" }
      - { name: body, label: Contenido, type: text }
