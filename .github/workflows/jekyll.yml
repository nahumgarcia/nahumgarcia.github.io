name: Build and deploy Jekyll site

on:
  push:
    branches: [gh-pages]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Resize photos for web
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick

          MAX_DIM=2000
          QUALITY=82
          THUMB_DIM=600
          THUMB_QUALITY=75

          mkdir -p assets/photos/thumb

          find assets/photos -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) -print0 |
            while IFS= read -r -d '' f; do
              name="$(basename "$f")"
              convert "$f" -resize "${THUMB_DIM}x${THUMB_DIM}>" -quality "$THUMB_QUALITY" "assets/photos/thumb/$name"
              mogrify -resize "${MAX_DIM}x${MAX_DIM}>" -quality "$QUALITY" "$f"
            done

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
