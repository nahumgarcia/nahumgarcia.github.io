---
layout: page
title: Fotos
permalink: /photos/
description: "ENTER HERE"
---

<ul class="gallery-list">
  {% for gallery in site.galleries %}
    <li class="gallery-item">
      <a href="{{ gallery.url | prepend: site.baseurl }}">
        {% assign first_photo = gallery.photos.items | first %}
        {% if first_photo %}
          <img 
            src="{{ site.baseurl }}/assets/photos/{{ gallery.photos.set }}/{{ first_photo.file }}" 
            alt="{{ first_photo.description | default: 'First photo of ' | append: gallery.title }}" 
            class="gallery-thumbnail"
          />
          <span class="gallery-item-title">{{ gallery.title }}</span>
        {% else %}
          <span class="gallery-no-image">No hay imágenes disponibles</span>
        {% endif %}
      </a>
    </li>
  {% endfor %}
</ul>
