---
layout: page
title: Fotos
permalink: /photos/
description: "ENTER HERE"
---

<ul class="gallery-list">
  {% for gallery in site.photos %}
    <li class="gallery-item">
      <a href="{{ gallery.url }}">
        <img src="{{ gallery.cover }}" alt="{{ gallery.title }}">
        <span class="gallery-item-title">{{ gallery.title }}</span>
      </a>
    </li>
  {% endfor %}
</ul>
